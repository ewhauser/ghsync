# ghsync dispatcher rules. Point DISPATCH_RULES_FILE at this file to make
# observed-payload findings deployable as data (SYNC_ENGINE §2.1).
rules:
  - event: pull_request
    action: "*"
    target: pull_request
    stacked_target: stack
  - event: pull_request
    action: "*"
    target: resolve_stack_membership
  - event: pull_request_review
    action: "*"
    target: pull_request
  - event: pull_request_review_comment
    action: "*"
    target: pull_request
  - event: pull_request_review_thread
    action: "*"
    target: pull_request
  - event: check_run
    action: "*"
    target: checks
  - event: check_suite
    action: "*"
    target: checks
  - event: push
    action: "*"
    target: branch
    # Pending real-payload validation: push payloads have no stack object.
    stacked_target: stack
