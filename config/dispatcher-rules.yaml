# Frontier dispatcher rules. Point DISPATCH_RULES_FILE at this file to make
# Phase-0 webhook findings deployable as data (SYNC_ENGINE §2.1).
rules:
  - event: pull_request
    action: "*"
    target: pull_request
    stacked_target: stack
  - event: pull_request
    action: "*"
    target: resolve_stack_membership
  - event: check_run
    action: "*"
    target: checks
  - event: check_suite
    action: "*"
    target: checks
  - event: push
    action: "*"
    target: branch
    stacked_target: stack
