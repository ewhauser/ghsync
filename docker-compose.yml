services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier"]
      interval: 2s
      timeout: 2s
      retries: 15

  fake-github:
    build:
      context: .
      dockerfile: Dockerfile.fake-github
    ports:
      - "127.0.0.1:9797:9797"
    healthcheck:
      test:
        [
          "CMD",
          "/fake-github",
          "-healthcheck-url=http://127.0.0.1:9797/healthz",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
