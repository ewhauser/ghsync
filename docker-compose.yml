services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier"]
      interval: 2s
      timeout: 2s
      retries: 15

  fake-github:
    build:
      context: .
      dockerfile: Dockerfile.fake-github
    ports:
      - "9797:9797"

volumes:
  pgdata:
