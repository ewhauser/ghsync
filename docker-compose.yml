services:
  postgres:
    image: postgres:16
    # Parallel DB tests (pgtestdb clones a database per test) open more
    # simultaneous connections than the default limit of 100 allows.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: ghsync
      POSTGRES_PASSWORD: ghsync
      POSTGRES_DB: ghsync
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghsync"]
      interval: 2s
      timeout: 2s
      retries: 15

  fake-github:
    build:
      context: .
      dockerfile: Dockerfile.fake-github
    ports:
      - "127.0.0.1:9797:9797"
    healthcheck:
      test:
        [
          "CMD",
          "/fake-github",
          "-healthcheck-url=http://127.0.0.1:9797/healthz",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
