name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_USER: ghsync
          POSTGRES_PASSWORD: ghsync
          POSTGRES_DB: ghsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghsync"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Disposable CI data: skip WAL durability so concurrent per-test
      # database clones and River pipelines are not fsync-bound on the
      # shared runner disk. synchronous_commit stays on (C-I1 verifies it);
      # fsync/full_page_writes are server-side and reloadable.
      - name: Relax CI Postgres durability
        run: |
          PGPASSWORD=ghsync psql -h localhost -U ghsync -d ghsync_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - run: go build ./...
      - run: go vet ./...
      - name: Unit and required database integration tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          packages=$(go list ./... | grep -v '/cmd/loadgen$')
          # Bound concurrent DB-backed tests: the 4-vCPU runner shares its
          # CPU with the Postgres service, and unbounded package/test
          # parallelism starves River's 5-10s election/fetch deadlines.
          go test -p 2 -parallel 2 $packages
      - name: Strict loadgen end-to-end tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          go test -race -count=1 -p=1 -parallel=1 ./cmd/loadgen
      - name: Race-sensitive sync engine tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          # cmd/loadgen's race coverage runs in its serial step above; its
          # end-to-end tests oversubscribe the runner in a parallel suite.
          go test -race -p 2 -parallel 2 \
            ./internal/budget/... \
            ./internal/gh/... \
            ./internal/fakegithub/... \
            ./internal/dispatch/... \
            ./internal/stream/... \
            ./pkg/streamclient/...
      - name: sqlc up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/dbgen

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go mod download
      - name: Cache custom golangci-lint
        id: cache-custom-gcl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', 'go.sum') }}
      - name: Refresh cached custom golangci-lint timestamp
        if: steps.cache-custom-gcl.outputs.cache-hit == 'true'
        run: chmod +x custom-gcl && touch custom-gcl
      - run: make lint

  load-smoke:
    name: load-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_USER: ghsync
          POSTGRES_PASSWORD: ghsync
          POSTGRES_DB: ghsync_load_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghsync"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same disposable-data durability relaxation as the test job.
      - name: Relax CI Postgres durability
        run: |
          PGPASSWORD=ghsync psql -h localhost -U ghsync -d ghsync_load_smoke -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - name: Build load-smoke binaries
        run: |
          go build -o /tmp/ghsyncd ./cmd/ghsyncd
          go build -o /tmp/fake-github ./cmd/fake-github
          go build -o /tmp/ghsync-loadgen ./cmd/loadgen
      - name: Replay committed recording with strict assertions
        shell: bash
        env:
          DATABASE_URL: postgres://ghsync:ghsync@127.0.0.1:5432/ghsync_load_smoke?sslmode=disable&pool_max_conns=20
          GITHUB_WEBHOOK_SECRET: smoke-secret
          GITHUB_BASE_URL: http://127.0.0.1:19797
          GITHUB_TOKEN: fake-installation-smoke-token
          GITHUB_INSTALLATION_ID: "1"
          GITHUB_ORG_ID: "1"
          HTTP_ADDR: 127.0.0.1:18080
          DISPATCH_DEBOUNCE: 100ms
          DISPATCH_POLL_INTERVAL: 25ms
          FETCH_BATCH_WINDOW: 2ms
          GAP_HEAL_PERIOD: 2s
          DRIFT_PERIOD: 5s
          SWEEP_OPEN_STACK_MAX_STALENESS: 30s
          SWEEP_OPEN_PR_MAX_STALENESS: 30s
          STREAM_WATERMARK_REFRESH: 50ms
          DERIVER_POLL_INTERVAL: 50ms
        run: |
          set -euo pipefail
          recording=internal/replay/testdata/workerd-week.ndjson
          expected_recording_events=1764
          expected_non_delivery_events=$((1 + 24 + 1)) # repository + commits + stack
          expected_deliveries=$((expected_recording_events - expected_non_delivery_events))
          actual_recording_events=$(($(wc -l < "$recording") - 1))
          actual_deliveries=$(
            tail -n +2 "$recording" |
              jq -s '[.[] | select(
                .kind != "repository" and
                .kind != "commit" and
                .kind != "stack"
              )] | length'
          )
          if [ "$actual_recording_events" -ne "$expected_recording_events" ] ||
             [ "$actual_deliveries" -ne "$expected_deliveries" ]; then
            echo "recording arithmetic changed: events=$actual_recording_events/$expected_recording_events deliveries=$actual_deliveries/$expected_deliveries"
            exit 1
          fi
          echo "load-smoke expects $expected_deliveries = $expected_recording_events - $expected_non_delivery_events deliveries"
          /tmp/ghsyncd migrate
          /tmp/fake-github \
            -addr=127.0.0.1:19797 \
            -webhook-secret="$GITHUB_WEBHOOK_SECRET" \
            -app-token="$GITHUB_TOKEN" \
            -recording="$recording" \
            > /tmp/fake-github.log 2>&1 &
          fake_pid=$!
          /tmp/ghsyncd serve --roles=all \
            > /tmp/ghsyncd.log 2>&1 &
          sync_pid=$!
          cleanup() {
            kill "$sync_pid" "$fake_pid" 2>/dev/null || true
            wait "$sync_pid" "$fake_pid" 2>/dev/null || true
          }
          on_exit() {
            status=$?
            set +e
            if [ "$status" -ne 0 ]; then
              echo "load-smoke failed; ghsyncd log follows"
              tail -200 /tmp/ghsyncd.log
              echo "fake-github log follows"
              tail -200 /tmp/fake-github.log
              if [ -f /tmp/ghsync-loadgen.log ]; then
                echo "loadgen log follows"
                tail -200 /tmp/ghsync-loadgen.log
              fi
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          for url in \
            http://127.0.0.1:19797/healthz \
            http://127.0.0.1:18080/healthz; do
            healthy=false
            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              echo "service did not become healthy: $url"
              exit 1
            fi
          done
          /tmp/ghsyncd backfill
          set +e
          /tmp/ghsync-loadgen \
            --database-url="$DATABASE_URL" \
            --installation-id="$GITHUB_INSTALLATION_ID" \
            --engine-url=http://127.0.0.1:18080 \
            --fake-github-url=http://127.0.0.1:19797 \
            --recording="$recording" \
            --expected-deliveries="$expected_deliveries" \
            --speed=10000 \
            --target-rate=20 \
            --traffic-timeout=2m \
            --drain-timeout=90s \
            2>&1 | tee /tmp/ghsync-loadgen.log
          loadgen_status=${PIPESTATUS[0]}
          set -e
          if [ "$loadgen_status" -ne 0 ]; then
            exit "$loadgen_status"
          fi
