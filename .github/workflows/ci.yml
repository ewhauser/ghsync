name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghsync
          POSTGRES_PASSWORD: ghsync
          POSTGRES_DB: ghsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghsync"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Unit and required database integration tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable&pool_max_conns=20
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          go test ./...
      - name: Race-sensitive sync engine tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable&pool_max_conns=20
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          go test -race \
            ./internal/budget/... \
            ./internal/gh/... \
            ./internal/fakegithub/... \
            ./internal/dispatch/... \
            ./internal/stream/... \
            ./pkg/streamclient/...
      - name: sqlc up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/dbgen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go mod download
      - name: Cache custom golangci-lint
        id: cache-custom-gcl
        uses: actions/cache@v4
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', 'go.sum') }}
      - name: Refresh cached custom golangci-lint timestamp
        if: steps.cache-custom-gcl.outputs.cache-hit == 'true'
        run: chmod +x custom-gcl && touch custom-gcl
      - run: make lint
