name: ci

on:
  push:
    branches: [sync-engine]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontier"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version: v2.12.2
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://frontier:frontier@localhost:5432/frontier_test?sslmode=disable
      - name: sqlc up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/dbgen
