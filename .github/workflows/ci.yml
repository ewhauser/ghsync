name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghsync
          POSTGRES_PASSWORD: ghsync
          POSTGRES_DB: ghsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghsync"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version: v2.12.2
      - run: go build ./...
      - run: go vet ./...
      - name: Unit and required database integration tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable&pool_max_conns=20
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          go test ./...
      - name: Race-sensitive sync engine tests
        env:
          TEST_DATABASE_URL: postgres://ghsync:ghsync@localhost:5432/ghsync_test?sslmode=disable&pool_max_conns=20
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL must be set in CI; DB-gated tests may not skip"
            exit 1
          fi
          go test -race \
            ./internal/budget/... \
            ./internal/gh/... \
            ./internal/fakegithub/... \
            ./internal/dispatch/... \
            ./internal/stream/... \
            ./pkg/streamclient/...
      - name: sqlc up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/dbgen

  soak-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghsync
          POSTGRES_PASSWORD: ghsync
          POSTGRES_DB: ghsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghsync"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build smoke binaries
        run: |
          go build -o /tmp/ghsyncd ./cmd/ghsyncd
          go build -o /tmp/fake-github ./cmd/fake-github
          go build -o /tmp/ghsync-soak ./cmd/soak
      - name: Run two-minute DB-gated soak smoke
        env:
          DATABASE_URL: postgres://ghsync:ghsync@127.0.0.1:5432/ghsync_test?sslmode=disable&pool_max_conns=20
          TEST_DATABASE_URL: postgres://ghsync:ghsync@127.0.0.1:5432/ghsync_test?sslmode=disable&pool_max_conns=20
          GITHUB_WEBHOOK_SECRET: smoke-secret
          GITHUB_BASE_URL: http://127.0.0.1:19797
          GITHUB_TOKEN: fake-installation-smoke
          GITHUB_INSTALLATION_ID: "1"
          GITHUB_ORG_ID: "1"
          HTTP_ADDR: 127.0.0.1:18080
          DRIFT_PERIOD: 5s
        run: |
          set -euo pipefail
          /tmp/ghsyncd migrate
          /tmp/fake-github -addr=127.0.0.1:19797 -webhook-secret=smoke-secret > /tmp/fake-github.log 2>&1 &
          fake_pid=$!
          /tmp/ghsyncd serve --roles=all > /tmp/ghsyncd.log 2>&1 &
          sync_pid=$!
          cleanup() {
            kill "$sync_pid" "$fake_pid" 2>/dev/null || true
            wait "$sync_pid" "$fake_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          /tmp/ghsyncd backfill
          if ! /tmp/ghsync-soak \
            --profile=smoke \
            --duration=2m \
            --recorded-rate=1 \
            --multiplier=10 \
            --database-url="$DATABASE_URL" \
            --installation-id="$GITHUB_INSTALLATION_ID" \
            --engine-url=http://127.0.0.1:18080 \
            --fake-github-url=http://127.0.0.1:19797; then
            tail -200 /tmp/ghsyncd.log
            tail -200 /tmp/fake-github.log
            exit 1
          fi
