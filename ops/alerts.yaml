groups:
  - name: frontier-sync-engine
    rules:
      - alert: FrontierSweepConditionalHitRateLow
        expr: frontier_c_b4_conditional_304_ratio{class="sweep",resource="rest"} < 0.80
        for: 15m
        labels: {severity: warning}
        annotations:
          constraint: C-B4
          summary: Sweep conditional 304 ratio is below 80 percent
          description: Quiet-org sweeps must return at least 80 percent 304s; check persisted ETags and response handling.
      - alert: FrontierBudgetFloorBreached
        expr: frontier_c_b3_budget_remaining{class=~"event|sweep"} < on(installation_id,class,resource) frontier_c_b3_budget_floor
        for: 1m
        labels: {severity: page}
        annotations:
          constraint: C-B3
          summary: A background budget class crossed its reserved floor
          description: The gate must retain 10 percent for event and 20 percent for sweep admission.
      - alert: FrontierBudgetClassStarved
        expr: increase(frontier_c_b3_starvations_total[5m]) > 0
        labels: {severity: page}
        annotations:
          constraint: C-B3
          summary: A GitHub request class is starved
          description: At least one request waited behind a reserved floor; inspect remaining budget and queued work.
      - alert: FrontierSecondaryGateClosed
        expr: frontier_c_b2_gate_closed_seconds > 60
        for: 5m
        labels: {severity: page}
        annotations:
          constraint: C-B2
          summary: The installation-wide GitHub gate is closed
          description: A secondary-limit response is blocking all GitHub calls for more than five minutes.
      - alert: FrontierEventCacheP95SLOBreach
        expr: histogram_quantile(0.95, sum by (le) (rate(frontier_c_q2_event_to_cache_latency_seconds_bucket[10m]))) > 20
        for: 10m
        labels: {severity: page}
        annotations:
          constraint: C-Q2
          summary: Event-to-cache p95 exceeds 20 seconds
          description: The bounded-debounce freshness SLO is breached at p95.
      - alert: FrontierEventCacheP99SLOBreach
        expr: histogram_quantile(0.99, sum by (le) (rate(frontier_c_q2_event_to_cache_latency_seconds_bucket[10m]))) > 60
        for: 10m
        labels: {severity: page}
        annotations:
          constraint: C-Q2
          summary: Event-to-cache p99 exceeds 60 seconds
          description: The bounded-debounce freshness SLO is breached at p99.
      - alert: FrontierOldestDeliveryTooOld
        expr: frontier_c_q2_oldest_unprocessed_delivery_age_seconds > 60
        for: 5m
        labels: {severity: page}
        annotations:
          constraint: C-Q2
          summary: An unprocessed webhook delivery is older than 60 seconds
          description: Dispatch or fetch is no longer keeping freshness within the p99 objective.
      - alert: FrontierEventQueueBacklog
        expr: frontier_c_p2_queue_depth{queue="event"} > 1000
        for: 5m
        labels: {severity: warning}
        annotations:
          constraint: C-P2
          summary: Event queue depth exceeds 1000 jobs
          description: Batched dispatch is producing work faster than event workers drain it.
      - alert: FrontierPoisonDeliveryParked
        expr: frontier_c_i5_parked_deliveries > 0 and frontier_c_i5_oldest_parked_delivery_age_seconds > 300
        for: 1m
        labels: {severity: page}
        annotations:
          constraint: C-I5
          summary: A parked delivery has remained unresolved for five minutes
          description: Diagnose the classification error, fix it, then use frontier-syncd requeue.
      - alert: FrontierCacheStalenessBoundBreached
        expr: frontier_c_r1_cache_staleness_seconds > on(entity_class) frontier_c_r1_staleness_bound_seconds
        for: 2m
        labels: {severity: page}
        annotations:
          constraint: C-R1
          summary: A cache entity class is beyond its staleness bound
          description: Open stacks are bounded at 5m, open PRs at 10m, repo rules at 1h, and closed displayed entities at 24h.
      - alert: FrontierSweepOverrun
        expr: increase(frontier_c_r2_sweep_overruns_total[15m]) > 0 or frontier_c_r2_sweep_duration_seconds > on(sweep_kind) frontier_c_r2_sweep_period_seconds
        labels: {severity: page}
        annotations:
          constraint: C-R2
          summary: A resumable sweep cannot finish inside its period
          description: Inspect its durable cursor, queue latency, and GitHub budget before the next period.
      - alert: FrontierDriftOpen
        expr: frontier_c_o3_drift_findings{state="open",entity_kind="all"} > 0
        for: 1m
        labels: {severity: page}
        annotations:
          constraint: C-O3
          summary: Semantic cache drift is open
          description: The cache is not trustworthy until the finding heals and resolves.
      - alert: FrontierWatermarkStalled
        expr: frontier_c_s2_watermark_lag_sequences > 0 and frontier_c_s2_watermark_age_seconds > 30
        for: 2m
        labels: {severity: page}
        annotations:
          constraint: C-S2
          summary: The visibility watermark is stalled behind committed outbox rows
          description: Check the watermarker lease and in-flight writer fence before restarting the role.
      - alert: FrontierOutboxBacklog
        expr: frontier_c_s2_outbox_depth{stream="all"} > 100000
        for: 15m
        labels: {severity: warning}
        annotations:
          constraint: C-S7
          summary: Retained outbox depth exceeds 100000 rows
          description: Confirm the pruner role is running and retention remains at least seven days.
      - alert: FrontierConsumerCursorStalled
        expr: frontier_c_s4_consumer_cursor_lag_sequences > 10000 and frontier_c_s4_consumer_cursor_age_seconds > 300
        for: 5m
        labels: {severity: warning}
        annotations:
          constraint: C-S4
          summary: A consumer cursor is more than 10000 sequences behind
          description: Contact the named consumer owner before its cursor crosses retention.
      - alert: FrontierResyncStorm
        expr: increase(frontier_c_s4_resyncs_total[15m]) > 3
        labels: {severity: page}
        annotations:
          constraint: C-S4
          summary: A consumer entered RESYNC_REQUIRED more than three times in 15 minutes
          description: Repeated bootstrap failure or retention churn is preventing convergence.
      - alert: FrontierDeriverBacklog
        expr: frontier_c_p5_deriver_dirty_backlog > 500
        for: 10m
        labels: {severity: warning}
        annotations:
          constraint: C-P5
          summary: Derivation dirty backlog exceeds one default batch
          description: Deriver passes are not draining dirty scopes at the configured cap.
